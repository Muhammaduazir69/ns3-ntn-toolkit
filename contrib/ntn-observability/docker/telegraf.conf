[agent]
  interval = "1s"
  flush_interval = "1s"
  metric_batch_size = 5000
  metric_buffer_limit = 50000
  omit_hostname = true

# UDP socket listener — accepts InfluxDB v1 line-protocol from ns-3 sinks.
[[inputs.socket_listener]]
  service_address = "udp://:8089"
  data_format = "influx"
  read_buffer_size = "8MB"
# OBS-04. A [[processors.starlark]] block used to sit here overwriting every
# point's timestamp with the Telegraf ingest time:
#
#     metric.time = time.now().unix_nano
#
# Its justification was that "ns-3 emits timestamps as Simulator::Now() (ns
# since 1970-01-01 = sim t0)", which would place every point ~55 years before
# the InfluxDB retention window. That was true once and is not any more:
# NtnInfluxSink::Push emits m_baseEpoch + simTime, where the base epoch defaults
# to wall-clock at construction, so the wire timestamp is already an absolute
# Unix time inside the retention window.
#
# The override was therefore destroying a correct timestamp and collapsing the
# entire simulated time axis onto the 1 s flush cadence: every point in a run
# landed at whichever second Telegraf happened to forward it, so a dashboard
# showed the shape of the flush loop rather than the shape of the simulation.
#
# Removed. A scenario that genuinely wants pure sim time can call
# NtnInfluxSink::SetBaseEpoch(Seconds(0)) and use file mode + `influx write`,
# which is what the old comment recommended for exact-time replays anyway.

# Forward to InfluxDB v2.
[[outputs.influxdb_v2]]
  urls = ["http://influxdb:8086"]
  token = "ntn-toolkit-token"
  organization = "ntn"
  bucket = "ntn"
