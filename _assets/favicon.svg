<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="ns3-ntn-toolkit">
  <title>ns3-ntn-toolkit</title>
  <!-- Compact favicon variant. The ".NTN" superscript and orbiting
       satellite are dropped because they don't survive at 16 × 16 —
       only the disk + n3 letters remain (still clearly the same brand). -->
  <g transform="translate(32 32)">
    <circle r="30" fill="#003049"/>
    <circle r="25" fill="none" stroke="#f77f00" stroke-width="1.2"
            stroke-dasharray="0.6 3.8" stroke-linecap="round"/>
    <text x="0" y="9" text-anchor="middle"
          font-family="Inter, system-ui, -apple-system, Helvetica, sans-serif"
          font-weight="800" font-size="34" fill="#ffffff"
          letter-spacing="-1.5">n3</text>
  </g>
</svg>
